name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:fixtures
      # Placeholder URL: CI only checks the production build/zip, never ships it.
      - run: npm run zip
        env:
          VITE_API_BASE_URL: https://api.ci.invalid
      - run: npm run verify-zip
      - uses: actions/upload-artifact@v4
        with:
          name: proposalpilot-extension
          path: extension/.output/*.zip

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
